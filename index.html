<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الانضباط المدرسي | Behavior System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- SheetJS for Excel handling -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Mammoth for Word handling -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; background-color: #f8fafc; }

        @media print {
            body * { visibility: hidden; }
            #print-area, #print-area * { visibility: visible; }
            #print-area { position: absolute; left: 0; top: 0; width: 100%; background: white; color: black; }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- Header / Navbar -->
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-3">
            <div class="flex items-center space-x-3 space-x-reverse">
                <div class="p-2.5 bg-sky-500 rounded-xl text-white shadow-md">
                    <i data-lucide="shield-check" class="w-7 h-7"></i>
                </div>
                <div>
                    <h1 class="text-xl font-extrabold tracking-wide">نظام الانضباط الموحد | Behavior System</h1>
                    <p class="text-xs text-slate-400">الصفوف 9 - 12 | Islamic Studies & KSA Studies</p>
                </div>
            </div>

            <!-- Subject Selector Tabs -->
            <div class="flex items-center bg-slate-800 p-1 rounded-xl border border-slate-700">
                <button id="subject-islamic-btn" onclick="switchSubject('islamic')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-sky-600 text-white shadow">
                    <i data-lucide="book-open" class="w-4 h-4"></i> التربية الإسلامية (Islamic)
                </button>
                <button id="subject-ksa-btn" onclick="switchSubject('ksa')" class="px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400 hover:text-white">
                    <i data-lucide="flag" class="w-4 h-4"></i> الدراسات السعودية (KSA)
                </button>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="exportCSV()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-xs font-bold flex items-center gap-1.5 transition shadow">
                    <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> تصدير Excel
                </button>
                <button onclick="resetAllScores()" class="bg-amber-500/10 hover:bg-amber-600 text-amber-400 hover:text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 transition border border-amber-500/30">
                    <i data-lucide="rotate-ccw" class="w-4 h-4"></i> تصفير النقاط
                </button>
                <!-- زر مسح كافة الطلاب -->
                <button onclick="deleteAllStudents()" class="bg-rose-600 hover:bg-rose-700 text-white px-3 py-2 rounded-lg text-xs font-bold flex items-center gap-1 transition shadow">
                    <i data-lucide="trash-2" class="w-4 h-4"></i> مسح كافة الطلاب
                </button>
                <!-- زر التراجع (يظهر مباشرة عند حدوث أي حذف) -->
                <button id="undo-header-btn" onclick="restoreBackup()" class="hidden bg-amber-500 hover:bg-amber-600 text-slate-900 px-3.5 py-2 rounded-lg text-xs font-black flex items-center gap-1.5 transition shadow animate-pulse">
                    <i data-lucide="undo-2" class="w-4 h-4"></i> تراجع عن الحذف
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 space-y-6">

        <!-- Controls & Filter & Import Link -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 justify-between items-center border-b pb-4">
                <div class="flex items-center gap-3 w-full md:w-auto">
                    <label class="font-bold text-slate-700 text-sm whitespace-nowrap flex items-center gap-2">
                        <i data-lucide="school" class="w-5 h-5 text-sky-600"></i> تصفية حسب الصف:
                    </label>
                    <select id="class-filter" onchange="renderStudents()" class="px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm font-bold text-slate-800 focus:outline-none focus:ring-2 focus:ring-sky-500 w-full md:w-60">
                        <option value="ALL">جميع الصفوف | All Grades</option>
                        <option value="Grade 9 (الصف التاسع)">Grade 9 (الصف التاسع)</option>
                        <option value="Grade 10 (الصف العاشر)">Grade 10 (الصف العاشر)</option>
                        <option value="Grade 11 (الصف الحادي عشر)">Grade 11 (الصف الحادي عشر)</option>
                        <option value="Grade 12 (الصف الثاني عشر)">Grade 12 (الصف الثاني عشر)</option>
                    </select>
                </div>

                <div class="flex items-center gap-2 w-full md:w-auto">
                    <div class="relative w-full md:w-72">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute right-3 top-3"></i>
                        <input id="search-input" oninput="renderStudents()" type="text" placeholder="بحث بالاسم أو ID..." class="pr-9 pl-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-sky-500 w-full">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-3 gap-3">
                <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <input id="new-student-name" type="text" placeholder="اسم الطالب" class="px-3 py-1.5 border border-slate-300 rounded-lg text-xs focus:outline-none w-full">
                    <select id="new-student-class" class="px-2 py-1.5 border border-slate-300 rounded-lg text-xs font-medium focus:outline-none w-32">
                        <option value="Grade 9 (الصف التاسع)">Grade 9</option>
                        <option value="Grade 10 (الصف العاشر)">Grade 10</option>
                        <option value="Grade 11 (الصف الحادي عشر)">Grade 11</option>
                        <option value="Grade 12 (الصف الثاني عشر)">Grade 12</option>
                    </select>
                    <button onclick="addSingleStudent()" class="bg-sky-600 hover:bg-sky-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs whitespace-nowrap transition">إضافة</button>
                </div>

                <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <input type="file" id="file-import" accept=".xlsx, .xls, .csv, .docx, .doc, .txt" class="hidden" onchange="handleFileUpload(event)">
                    <button onclick="document.getElementById('file-import').click()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition">
                        <i data-lucide="upload" class="w-4 h-4"></i> رفع ملف (Excel / Word)
                    </button>
                </div>

                <div class="flex items-center gap-2 bg-slate-50 p-2.5 rounded-xl border border-slate-200">
                    <button onclick="importFromURLLink()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1.5 transition">
                        <i data-lucide="link" class="w-4 h-4"></i> جلب من رابط Excel / Google Sheets
                    </button>
                </div>
            </div>
        </div>

        <!-- Dashboard Stats -->
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
            <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex items-center justify-between">
                <div>
                    <p id="subject-stat-label" class="text-xs font-bold text-slate-400">طلاب المادة الحالية</p>
                    <p id="stat-students" class="text-2xl font-black text-slate-700">0</p>
                </div>
                <div class="p-3 bg-slate-100 rounded-xl text-slate-600"><i data-lucide="users" class="w-6 h-6"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-emerald-100 flex items-center justify-between">
                <div>
                    <p id="stat-green-points" class="text-xs font-bold text-emerald-600">بطاقات خضراء 🟢</p>
                    <p id="stat-green" class="text-2xl font-black text-emerald-600">0</p>
                </div>
                <div class="p-3 bg-emerald-50 rounded-xl text-emerald-600"><i data-lucide="check-circle" class="w-6 h-6"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-amber-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-amber-600">بطاقات صفراء 🟡 (-0.5)</p>
                    <p id="stat-yellow" class="text-2xl font-black text-amber-600">0</p>
                </div>
                <div class="p-3 bg-amber-50 rounded-xl text-amber-600"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow-sm border border-rose-100 flex items-center justify-between">
                <div>
                    <p class="text-xs font-bold text-rose-600">بطاقات حمراء 🔴 (-1.0)</p>
                    <p id="stat-red" class="text-2xl font-black text-rose-600">0</p>
                </div>
                <div class="p-3 bg-rose-50 rounded-xl text-rose-600"><i data-lucide="x-circle" class="w-6 h-6"></i></div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div class="lg:col-span-2 space-y-4">
                <div id="students-container" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
            </div>

            <!-- Real-time Activity Log -->
            <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-5 h-fit space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="text-base font-bold text-slate-800 flex items-center gap-2">
                        <i data-lucide="history" class="w-5 h-5 text-slate-600"></i> سجل التوثيق (<span id="current-subject-log-name">Islamic</span>)
                    </h2>
                    <span id="log-count" class="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-bold">0 Records</span>
                </div>

                <div id="activity-log" class="space-y-3 max-h-[550px] overflow-y-auto pr-1">
                    <p class="text-slate-400 text-center text-sm py-8">لا توجد حركات مسجلة لهذه المادة.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification للتراجع السريع -->
    <div id="toast-undo" class="fixed bottom-5 left-5 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl z-50 flex items-center gap-4 hidden border border-slate-700">
        <span id="toast-message" class="text-xs font-bold text-slate-200">تم مسح المحتوى.</span>
        <button onclick="restoreBackup()" class="bg-amber-500 hover:bg-amber-600 text-slate-900 px-3 py-1 rounded-lg text-xs font-black transition flex items-center gap-1">
            <i data-lucide="undo-2" class="w-3.5 h-3.5"></i> تراجع الآن
        </button>
    </div>

    <!-- Modal for Behavior Selection -->
    <div id="reason-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-md w-full p-6 space-y-4 border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="reason-modal-title" class="text-base font-bold text-slate-800">تحديد السبب</h3>
                <button onclick="closeReasonModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
            </div>
            
            <p id="reason-modal-student-info" class="text-xs font-bold text-sky-700 bg-sky-50 p-2 rounded-lg"></p>

            <div class="space-y-2">
                <label class="block text-xs font-bold text-slate-600">اختر السبب / نوع الملاحظة الصفية:</label>
                <select id="reason-select" onchange="toggleCustomReasonInput()" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg text-xs font-bold text-slate-800 focus:outline-none">
                </select>
            </div>

            <div id="custom-reason-container" class="hidden space-y-1">
                <label class="block text-xs font-bold text-slate-600">اكتب الملاحظة الخاصة:</label>
                <input id="custom-reason-input" type="text" placeholder="مثال: نسى دفتر التمارين..." class="w-full p-2 border border-slate-300 rounded-lg text-xs focus:outline-none">
            </div>

            <div class="flex justify-end gap-2 pt-3 border-t">
                <button onclick="closeReasonModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-xs">إلغاء</button>
                <button onclick="confirmCardAssignment()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-5 py-2 rounded-lg text-xs">حفظ وتأكيد</button>
            </div>
        </div>
    </div>

    <!-- Modal for Email -->
    <div id="email-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 id="modal-title" class="text-lg font-bold text-slate-800 flex items-center gap-2"></h3>
                <div class="flex items-center gap-2">
                    <button id="lang-toggle-btn" onclick="toggleEmailLanguage()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-1 rounded-lg text-xs font-bold border border-slate-300 flex items-center gap-1 transition">
                        <i data-lucide="languages" class="w-4 h-4"></i> <span id="lang-btn-text">English</span>
                    </button>
                    <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">موضوع الرسالة / Subject:</label>
                <input id="email-subject" type="text" readonly class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 text-sm font-bold text-slate-800 focus:outline-none">
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 mb-1">نص الرسالة الصادر من معلم المادة / Teacher Message Body:</label>
                <textarea id="email-body" rows="11" readonly class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 text-sm text-slate-700 font-medium leading-relaxed focus:outline-none"></textarea>
            </div>
            <div class="flex justify-end gap-2 pt-2 border-t">
                <button onclick="closeModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-lg text-sm">إغلاق</button>
                <button onclick="copyEmailText()" class="bg-sky-600 hover:bg-sky-700 text-white font-bold px-5 py-2 rounded-lg text-sm flex items-center gap-2">
                    <i data-lucide="copy" class="w-4 h-4"></i> نسخ النص
                </button>
            </div>
        </div>
    </div>

    <!-- Print Area -->
    <div id="print-area" class="hidden p-8"></div>

    <script>
        let currentSubject = 'islamic'; 
        let pendingCardAction = { studentId: null, cardType: null };
        let stateHistory = []; // سجل للتراجع Multi-level Backup

        const reasonsList = {
            green: [
                "المشاركة والمناقشة الفعالة بالحصة",
                "إنجاز الواجب والمهام بدرجة ممتازة",
                "الالتزام والانضباط والهدوء التام",
                "مساعدة الزملاء وإغناء البيئة الصفية",
                "سبب آخر..."
            ],
            yellow: [
                "عدم حل/تسليم الواجب المدرسي",
                "الكلام والحديث الجانبي بدون إذن",
                "التأخر عن حضور الحصة الصفية",
                "التشتت والتغافل أثناء الشرح",
                "سبب آخر..."
            ],
            red: [
                "الخروج من الصف بدون إذن المعلم",
                "التعطيل وإثارة الشغب المتكرر داخل الفصل",
                "عدم إحضار الكتاب أو الأدوات المدرسية",
                "عدم احترام تعليمات المعلم وقواعد الصف",
                "سبب آخر..."
            ]
        };

        const defaultData = {
            islamic: { students: [], logs: [] },
            ksa: { students: [], logs: [] }
        };

        let appData = JSON.parse(localStorage.getItem('school_data_v12')) || defaultData;

        let currentEmailStudent = null;
        let currentEmailColor = null;
        let currentEmailLang = 'ar';

        function saveSnapshot() {
            stateHistory.push(JSON.stringify(appData));
            if (stateHistory.length > 10) stateHistory.shift(); // الاحتفاظ بـ 10 خطوات للتراجع
            showUndoButtons(true);
        }

        function restoreBackup() {
            if (stateHistory.length === 0) return;
            const previousState = stateHistory.pop();
            appData = JSON.parse(previousState);
            localStorage.setItem('school_data_v12', JSON.stringify(appData));
            
            renderStudents();
            renderLogs();
            updateStats();

            if (stateHistory.length === 0) {
                showUndoButtons(false);
            }
        }

        function showUndoButtons(show, msg = "تم إجراء التغيير.") {
            const undoHeader = document.getElementById('undo-header-btn');
            const toast = document.getElementById('toast-undo');
            const toastMsg = document.getElementById('toast-message');

            if (show) {
                undoHeader.classList.remove('hidden');
                toastMsg.innerText = msg;
                toast.classList.remove('hidden');
            } else {
                undoHeader.classList.add('hidden');
                toast.classList.add('hidden');
            }
        }

        function switchSubject(subject) {
            currentSubject = subject;
            const islamicBtn = document.getElementById('subject-islamic-btn');
            const ksaBtn = document.getElementById('subject-ksa-btn');

            if(subject === 'islamic') {
                islamicBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-sky-600 text-white shadow";
                ksaBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400 hover:text-white";
                document.getElementById('stat-green-points').innerText = "بطاقات خضراء 🟢 (+1.0)";
                document.getElementById('current-subject-log-name').innerText = "Islamic Studies";
            } else {
                ksaBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 bg-emerald-600 text-white shadow";
                islamicBtn.className = "px-4 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 text-slate-400 hover:text-white";
                document.getElementById('stat-green-points').innerText = "بطاقات خضراء 🟢 (+0.5)";
                document.getElementById('current-subject-log-name').innerText = "KSA Studies";
            }

            renderStudents();
            renderLogs();
            updateStats();
            lucide.createIcons();
        }

        function saveData() {
            localStorage.setItem('school_data_v12', JSON.stringify(appData));
            updateStats();
            renderLogs();
        }

        function addSingleStudent() {
            const nameInput = document.getElementById('new-student-name');
            const classSelect = document.getElementById('new-student-class');
            const name = nameInput.value.trim();
            if(!name) { alert('يرجى إدخال اسم الطالب'); return; }

            saveSnapshot();

            appData[currentSubject].students.push({
                id: Date.now().toString(),
                name: name,
                grade: classSelect.value,
                score: 20.0,
                green: 0, yellow: 0, red: 0
            });

            nameInput.value = '';
            saveData();
            renderStudents();
        }

        function deleteAllStudents() {
            if (appData[currentSubject].students.length === 0) {
                alert('القائمة فارغة بالفعل!');
                return;
            }

            if(confirm(`⚠️ هل أنت تأكد من مسح جميع الطلاب كلياً لمادة (${currentSubject.toUpperCase()})؟`)) {
                saveSnapshot();
                appData[currentSubject].students = [];
                appData[currentSubject].logs = [];
                saveData();
                renderStudents();
                showUndoButtons(true, "تم مسح كافة الطلاب.");
            }
        }

        function removeStudent(id) {
            saveSnapshot();
            appData[currentSubject].students = appData[currentSubject].students.filter(s => s.id !== id);
            saveData(); 
            renderStudents();
            showUndoButtons(true, "تم حذف الطالب.");
        }

        function processExcelFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                let count = 0;

                saveSnapshot();

                json.forEach((row) => {
                    let nameVal = '';
                    let gradeVal = 'Grade 9 (الصف التاسع)';

                    if (row && row.length > 0) {
                        for (let col = 0; col < row.length; col++) {
                            let cell = row[col] ? row[col].toString().trim() : '';
                            if (cell && isNaN(cell) && !cell.includes('اسم') && !cell.toLowerCase().includes('name')) {
                                nameVal = cell;
                                if (row[col + 1]) gradeVal = row[col + 1].toString().trim();
                                break;
                            }
                        }
                    }

                    if (nameVal !== '' && nameVal.length > 1) {
                        appData[currentSubject].students.push({
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                            name: nameVal,
                            grade: gradeVal,
                            score: 20.0, green: 0, yellow: 0, red: 0
                        });
                        count++;
                    }
                });

                saveData(); 
                renderStudents(); 
                alert(`تم استيراد ${count} طالب بنجاح وترشيح الأسطر الفارغة!`);
            };
            reader.readAsArrayBuffer(file);
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const fileName = file.name.toLowerCase();

            if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls') || fileName.endsWith('.csv')) processExcelFile(file);
            else if (fileName.endsWith('.docx') || fileName.endsWith('.doc')) processWordFile(file);
            else if (fileName.endsWith('.txt')) processTextFile(file);
            else alert('صيغة غير مدعومة.');
            event.target.value = '';
        }

        function processWordFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                mammoth.extractRawText({ arrayBuffer: e.target.result }).then(function(result) {
                    let count = 0;
                    saveSnapshot();
                    result.value.split('\n').forEach(line => {
                        if (line.trim() && line.trim().length > 1) {
                            appData[currentSubject].students.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 4), name: line.trim(), grade: "Grade 9 (الصف التاسع)", score: 20.0, green: 0, yellow: 0, red: 0 });
                            count++;
                        }
                    });
                    saveData(); renderStudents(); alert(`تم استيراد ${count} طالب.`);
                });
            };
            reader.readAsArrayBuffer(file);
        }

        function processTextFile(file) {
            const reader = new FileReader();
            reader.onload = function(e) {
                let count = 0;
                saveSnapshot();
                e.target.result.split('\n').forEach(line => {
                    if (line.trim() && line.trim().length > 1) {
                        appData[currentSubject].students.push({ id: Date.now().toString() + Math.random().toString(36).substr(2, 4), name: line.trim(), grade: "Grade 9 (الصف التاسع)", score: 20.0, green: 0, yellow: 0, red: 0 });
                        count++;
                    }
                });
                saveData(); renderStudents(); alert(`تم استيراد ${count} طالب.`);
            };
            reader.readAsText(file);
        }

        function importFromURLLink() {
            const url = prompt("أدخل رابط ملف Excel أو Google Sheets (رابط مباشر):");
            if (!url) return;

            fetch(url)
                .then(res => res.arrayBuffer())
                .then(buffer => {
                    const data = new Uint8Array(buffer);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const json = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1 });
                    let count = 0;
                    saveSnapshot();
                    json.forEach((row) => {
                        if (row[0] && row[0].toString().trim().length > 1 && !row[0].toString().includes('اسم')) {
                            appData[currentSubject].students.push({
                                id: Date.now().toString() + Math.random().toString(36).substr(2, 4),
                                name: row[0].toString().trim(),
                                grade: row[1] ? row[1].toString().trim() : "Grade 9 (الصف التاسع)",
                                score: 20.0, green: 0, yellow: 0, red: 0
                            });
                            count++;
                        }
                    });
                    saveData(); renderStudents(); alert(`تم استيراد ${count} طالب بنجاح!`);
                })
                .catch(() => alert("تعذر استيراد البيانات من الرابط."));
        }

        function openReasonModal(studentId, cardType) {
            const student = appData[currentSubject].students.find(s => s.id === studentId);
            if (!student) return;

            pendingCardAction = { studentId, cardType };
            const select = document.getElementById('reason-select');
            select.innerHTML = '';
            
            reasonsList[cardType].forEach(reason => {
                const opt = document.createElement('option');
                opt.value = reason;
                opt.innerText = reason;
                select.appendChild(opt);
            });

            document.getElementById('reason-modal-student-info').innerText = `الطالب: ${student.name} | الصف: ${student.grade}`;
            toggleCustomReasonInput();
            document.getElementById('reason-modal').classList.remove('hidden');
        }

        function toggleCustomReasonInput() {
            const selectVal = document.getElementById('reason-select').value;
            const customContainer = document.getElementById('custom-reason-container');
            if (selectVal === 'سبب آخر...') customContainer.classList.remove('hidden');
            else customContainer.classList.add('hidden');
        }

        function closeReasonModal() {
            document.getElementById('reason-modal').classList.add('hidden');
            document.getElementById('custom-reason-input').value = '';
        }

        function confirmCardAssignment() {
            const { studentId, cardType } = pendingCardAction;
            if (!studentId || !cardType) return;

            const student = appData[currentSubject].students.find(s => s.id === studentId);
            if (!student) return;

            saveSnapshot();

            let selectedReason = document.getElementById('reason-select').value;
            if (selectedReason === 'سبب آخر...') {
                selectedReason = document.getElementById('custom-reason-input').value.trim() || 'ملاحظة صفية عامة';
            }

            const now = new Date();
            const timestamp = now.toLocaleDateString('en-GB') + ' - ' + now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
            let cardName = '', badgeClass = '';
            const greenPoints = currentSubject === 'islamic' ? 1.0 : 0.5;

            if (cardType === 'green') {
                student.green++;
                student.score = Math.min(20, student.score + greenPoints);
                cardName = `بطاقة خضراء 🟢 (+${greenPoints})`;
                badgeClass = 'bg-emerald-100 text-emerald-800 border-emerald-300';
            } else if (cardType === 'yellow') {
                student.yellow++;
                student.score = Math.max(0, student.score - 0.5);
                cardName = 'بطاقة صفراء 🟡 (-0.5)';
                badgeClass = 'bg-amber-100 text-amber-800 border-amber-300';
            } else if (cardType === 'red') {
                student.red++;
                student.score = Math.max(0, student.score - 1.0);
                cardName = 'بطاقة حمراء 🔴 (-1.0)';
                badgeClass = 'bg-rose-100 text-rose-800 border-rose-300';
            }

            appData[currentSubject].logs.unshift({
                id: Date.now(), studentId: student.id, studentName: student.name,
                grade: student.grade, cardName: cardName, reason: selectedReason, timestamp: timestamp,
                newScore: student.score, badgeClass: badgeClass
            });

            closeReasonModal();
            saveData();
            renderStudents();

            if (student.green === 4 && cardType === 'green') showEmailModal(student, 'green');
            else if (student.yellow === 4 && cardType === 'yellow') showEmailModal(student, 'yellow');
            else if (student.red === 4 && cardType === 'red') showEmailModal(student, 'red');
        }

        function showEmailModal(student, color) {
            currentEmailStudent = student;
            currentEmailColor = color;
            currentEmailLang = 'ar';
            renderEmailContent();
            document.getElementById('email-modal').classList.remove('hidden');
            lucide.createIcons();
        }

        function toggleEmailLanguage() {
            currentEmailLang = currentEmailLang === 'ar' ? 'en' : 'ar';
            renderEmailContent();
        }

        function renderEmailContent() {
            const student = currentEmailStudent;
            const color = currentEmailColor;
            const isAr = currentEmailLang === 'ar';
            const subjectName = currentSubject === 'islamic' ? 'مادة التربية الإسلامية / Islamic Studies' : 'مادة الدراسات السعودية / KSA Studies';

            const modalTitle = document.getElementById('modal-title');
            const subjectInput = document.getElementById('email-subject');
            const bodyInput = document.getElementById('email-body');
            const langBtnText = document.getElementById('lang-btn-text');

            langBtnText.innerText = isAr ? 'English' : 'عربي (Arabic)';
            bodyInput.dir = isAr ? 'rtl' : 'ltr';

            if (color === 'green') {
                modalTitle.innerHTML = `<span class="text-emerald-600">🟢 ${isAr ? `رسالة إشادة من معلم (${subjectName})` : `Praise Email (${subjectName})`}</span>`;
                if (isAr) {
                    subjectInput.value = `🌟 إشادة وتميز في ${subjectName}: ${student.name}`;
                    bodyInput.value = `المكرم ولي أمر الطالب: ${student.name} المحترم،\nالصف: ${student.grade}\n\nالسلام عليكم ورحمة الله وبركاته،،،\n\nأود بصفتي معلم ${subjectName} أن أشارككم تميز ابنكم الملحوظ داخل الفصل والتزامه السلوكي.\n\nتم منحه (4 بطاقات خضراء 🟢)، وحصل على رصيد سلوكي (${student.score.toFixed(1)} من 20).\n\nأتوجه لكم بجزيل الشكر،،\nمعلم المادة`;
                } else {
                    subjectInput.value = `🌟 Subject Commendation (${subjectName}): ${student.name}`;
                    bodyInput.value = `Dear Parent/Guardian of ${student.name},\nGrade: ${student.grade}\n\nGreetings,\n\nAs the teacher for ${subjectName}, I am delighted to share that your child has demonstrated outstanding behavior.\n\n4 Green Cards 🟢 awarded. Current Score: (${student.score.toFixed(1)} / 20).\n\nBest regards,\nSubject Teacher`;
                }
            } 
            else if (color === 'yellow') {
                modalTitle.innerHTML = `<span class="text-amber-600">🟡 ${isAr ? `رسالة تنبيه من معلم (${subjectName})` : `Behavior Notice (${subjectName})`}</span>`;
                if (isAr) {
                    subjectInput.value = `⚠️ تنبيه سلوكي في ${subjectName}: ${student.name}`;
                    bodyInput.value = `المكرم ولي أمر الطالب: ${student.name} المحترم،\nالصف: ${student.grade}\n\nالسلام عليكم ورحمة الله وبركاته،،،\n\nحرصاً مني على مصلحة الطالب، أحاطتكم بتسجيل (4 بطاقات صفراء 🟡) لملاحظات كعدم حل الواجب أو الكلام أثناء الشرح. الرصيد: (${student.score.toFixed(1)} من 20).\n\nنأمل المتابعة والاهتمام.\n\nمعلم المادة`;
                } else {
                    subjectInput.value = `⚠️ Classroom Notice (${subjectName}): ${student.name}`;
                    bodyInput.value = `Dear Parent/Guardian of ${student.name},\nGrade: ${student.grade}\n\nGreetings,\n\n4 Yellow Cards 🟡 recorded for classroom behaviors like homework neglect or talking without permission. Current Score: (${student.score.toFixed(1)} / 20).\n\nSubject Teacher`;
                }
            } 
            else if (color === 'red') {
                modalTitle.innerHTML = `<span class="text-rose-600">🔴 ${isAr ? `إشعار مخالفة من معلم (${subjectName})` : `Behavior Escalation (${subjectName})`}</span>`;
                if (isAr) {
                    subjectInput.value = `🚨 إشعار رسمي من معلم ${subjectName}: ${student.name}`;
                    bodyInput.value = `المكرم ولي أمر الطالب: ${student.name} المحترم،\nالصف: ${student.grade}\n\nالسلام عليكم ورحمة الله وبركاته،،،\n\nيؤسفني إبلاغكم بتسجيل (4 بطاقات حمراء 🔴) لمخالفات كالمغادرة دون إذن أو التعطيل المستمر. الرصيد: (${student.score.toFixed(1)} من 20).\n\nجرى رفع الملاحظات لإدارة المدرسة.\n\nمعلم المادة`;
                } else {
                    subjectInput.value = `🚨 Behavioral Escalation (${subjectName}): ${student.name}`;
                    bodyInput.value = `Dear Parent/Guardian of ${student.name},\nGrade: ${student.grade}\n\nGreetings,\n\n4 Red Cards 🔴 issued due to severe classroom infractions. Current Score: (${student.score.toFixed(1)} / 20).\n\nSubject Teacher`;
                }
            }
        }

        function closeModal() {
            document.getElementById('email-modal').classList.add('hidden');
        }

        function copyEmailText() {
            const subject = document.getElementById('email-subject').value;
            const body = document.getElementById('email-body').value;
            navigator.clipboard.writeText(`Subject: ${subject}\n\n${body}`).then(() => alert('تم النسخ بنجاح!'));
        }

        function updateStudentGrade(id, newGrade) {
            saveSnapshot();
            const student = appData[currentSubject].students.find(s => s.id === id);
            if(student) { student.grade = newGrade; saveData(); }
        }

        function getFilteredStudents() {
            const selectedClass = document.getElementById('class-filter').value;
            const query = document.getElementById('search-input').value.toLowerCase();
            return appData[currentSubject].students.filter(s => {
                const matchesClass = (selectedClass === 'ALL' || s.grade === selectedClass);
                const matchesSearch = s.name.toLowerCase().includes(query) || s.grade.toLowerCase().includes(query);
                return matchesClass && matchesSearch;
            });
        }

        function renderStudents() {
            const container = document.getElementById('students-container');
            const filtered = getFilteredStudents();
            container.innerHTML = '';

            const greenPointsLabel = currentSubject === 'islamic' ? '+1.0' : '+0.5';

            if(filtered.length === 0) {
                container.innerHTML = `<div class="col-span-full bg-white p-8 rounded-xl text-center text-slate-400 border border-dashed border-slate-300 font-medium">لا يوجد طلاب لهذه المادة / الصف. قم برفع ملف Excel محدد بشكل صحيح.</div>`;
                updateStats(); return;
            }

            filtered.forEach(student => {
                const isRedAlert = student.red >= 4;
                const isYellowAlert = student.yellow >= 4;
                const isGreenAlert = student.green >= 4;

                const card = document.createElement('div');
                card.className = `bg-white rounded-xl shadow-sm border p-4 space-y-3 relative flex flex-col justify-between ${isRedAlert ? 'border-rose-500 ring-2 ring-rose-200' : isYellowAlert ? 'border-amber-400' : isGreenAlert ? 'border-emerald-400' : 'border-slate-200'}`;
                
                card.innerHTML = `
                    <div class="space-y-2">
                        <div class="flex justify-between items-start">
                            <div>
                                <h3 class="font-bold text-slate-900 text-base leading-snug flex items-center gap-1.5">
                                    ${student.name}
                                    ${isRedAlert ? '🔴' : ''} ${isYellowAlert ? '🟡' : ''} ${isGreenAlert ? '🌟' : ''}
                                </h3>
                                <div class="flex items-center gap-1.5 mt-1">
                                    <span class="text-xs text-slate-400 font-medium">الصف:</span>
                                    <select onchange="updateStudentGrade('${student.id}', this.value)" class="text-xs font-bold bg-sky-50 text-sky-800 border border-sky-200 rounded px-1.5 py-0.5 focus:outline-none">
                                        <option value="Grade 9 (الصف التاسع)" ${student.grade === 'Grade 9 (الصف التاسع)' ? 'selected' : ''}>Grade 9</option>
                                        <option value="Grade 10 (الصف العاشر)" ${student.grade === 'Grade 10 (الصف العاشر)' ? 'selected' : ''}>Grade 10</option>
                                        <option value="Grade 11 (الصف الحادي عشر)" ${student.grade === 'Grade 11 (الصف الحادي عشر)' ? 'selected' : ''}>Grade 11</option>
                                        <option value="Grade 12 (الصف الثاني عشر)" ${student.grade === 'Grade 12 (الصف الثاني عشر)' ? 'selected' : ''}>Grade 12</option>
                                    </select>
                                </div>
                            </div>
                            <button onclick="removeStudent('${student.id}')" title="حذف الطالب" class="text-slate-300 hover:text-rose-500 transition p-1"><i data-lucide="x-circle" class="w-5 h-5"></i></button>
                        </div>

                        <div class="flex justify-between items-center bg-slate-50 p-2 rounded-lg border border-slate-100">
                            <span class="text-xs text-slate-500 font-bold">الرصيد:</span>
                            <span class="text-sm font-black text-slate-800 bg-white px-2.5 py-0.5 rounded border border-slate-200">${student.score.toFixed(1)} / 20</span>
                        </div>

                        <div class="flex justify-between gap-1 text-xs bg-slate-50/80 p-2 rounded-lg text-slate-600 font-medium text-center">
                            <span>🟢 <strong>${student.green}</strong></span>
                            <span>🟡 <strong>${student.yellow}</strong></span>
                            <span>🔴 <strong>${student.red}</strong></span>
                        </div>
                    </div>

                    <div class="space-y-2 pt-2 border-t border-slate-100">
                        <div class="grid grid-cols-3 gap-2">
                            <button onclick="openReasonModal('${student.id}', 'green')" class="bg-emerald-500 hover:bg-emerald-600 text-white py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition shadow-sm">
                                <span>🟢 أخضر</span>
                                <span class="text-[10px] opacity-80">${greenPointsLabel}</span>
                            </button>
                            <button onclick="openReasonModal('${student.id}', 'yellow')" class="bg-amber-500 hover:bg-amber-600 text-white py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition shadow-sm">
                                <span>🟡 أصفر</span>
                                <span class="text-[10px] opacity-80">-0.5</span>
                            </button>
                            <button onclick="openReasonModal('${student.id}', 'red')" class="bg-rose-500 hover:bg-rose-600 text-white py-2 rounded-lg font-bold text-xs flex flex-col items-center justify-center transition shadow-sm">
                                <span>🔴 أحمر</span>
                                <span class="text-[10px] opacity-80">-1.0</span>
                            </button>
                        </div>
                        
                        <div class="flex gap-1.5">
                            <button onclick="printStudentReport('${student.id}')" class="flex-1 bg-slate-800 hover:bg-slate-900 text-white py-1.5 rounded-lg font-bold text-xs flex items-center justify-center gap-1 transition shadow-sm">
                                <i data-lucide="printer" class="w-3.5 h-3.5"></i> التقرير
                            </button>
                            ${(isGreenAlert || isYellowAlert || isRedAlert) ? `<button onclick="showEmailModal(appData['${currentSubject}'].students.find(s=>s.id==='${student.id}'), '${isGreenAlert?'green':isYellowAlert?'yellow':'red'}')" class="bg-sky-600 hover:bg-sky-700 text-white px-2.5 py-1.5 rounded-lg font-bold text-xs flex items-center gap-1"><i data-lucide="mail" class="w-3.5 h-3.5"></i> إيميل</button>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
            updateStats();
            lucide.createIcons();
        }

        function renderLogs() {
            const container = document.getElementById('activity-log');
            const currentLogs = appData[currentSubject].logs;
            document.getElementById('log-count').innerText = `${currentLogs.length} Records`;
            container.innerHTML = '';

            if(currentLogs.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center text-sm py-8">لا توجد حركات مسجلة لهذه المادة.</p>';
                return;
            }

            currentLogs.forEach(log => {
                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border text-xs space-y-1 ${log.badgeClass}`;
                item.innerHTML = `
                    <div class="flex justify-between font-bold">
                        <span>${log.studentName} <span class="text-[10px] opacity-75">(${log.grade || ''})</span></span>
                        <span>${log.cardName}</span>
                    </div>
                    <div class="text-[11px] font-semibold text-slate-700">📌 السبب: ${log.reason || 'غير محدد'}</div>
                    <div class="flex justify-between text-[10px] opacity-80 pt-0.5">
                        <span>🕒 ${log.timestamp}</span>
                        <span>الرصيد: ${log.newScore.toFixed(1)}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function updateStats() {
            const filtered = getFilteredStudents();
            document.getElementById('stat-students').innerText = filtered.length;
            document.getElementById('stat-green').innerText = filtered.reduce((acc, s) => acc + s.green, 0);
            document.getElementById('stat-yellow').innerText = filtered.reduce((acc, s) => acc + s.yellow, 0);
            document.getElementById('stat-red').innerText = filtered.reduce((acc, s) => acc + s.red, 0);
        }

        function printStudentReport(studentId) {
            const student = appData[currentSubject].students.find(s => s.id === studentId);
            if(!student) return;
            const studentLogs = appData[currentSubject].logs.filter(l => l.studentId === student.id || l.studentName === student.name);

            let logsHTML = '';
            if(studentLogs.length === 0) {
                logsHTML = `<tr><td colspan="4" style="text-align:center; padding: 12px; border: 1px solid #ccc;">لا توجد سجلات.</td></tr>`;
            } else {
                studentLogs.forEach(log => {
                    logsHTML += `<tr>
                        <td style="padding: 10px; border: 1px solid #ddd;">${log.timestamp}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${log.cardName}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${log.reason || '-'}</td>
                        <td style="padding: 10px; border: 1px solid #ddd;">${log.newScore.toFixed(1)} / 20</td>
                    </tr>`;
                });
            }

            const printContent = `
                <div style="font-family: 'Tajawal', sans-serif; direction: rtl; padding: 20px;">
                    <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 15px; margin-bottom: 20px;">
                        <h1 style="font-size: 22px; font-weight: bold; margin: 0;">تقرير السلوك والانضباط المدرسي - معلم مادة (${currentSubject.toUpperCase()})</h1>
                    </div>
                    <div style="display: flex; justify-content: space-between; background: #f4f4f5; padding: 15px; border-radius: 8px; margin-bottom: 20px;">
                        <div>
                            <p style="margin: 3px 0; font-size: 15px;"><strong>اسم الطالب:</strong> ${student.name}</p>
                            <p style="margin: 3px 0; font-size: 15px;"><strong>الصف:</strong> ${student.grade}</p>
                        </div>
                        <div style="text-align: left;">
                            <p style="margin: 3px 0; font-size: 15px;"><strong>الرصيد الحالي:</strong> ${student.score.toFixed(1)} / 20</p>
                        </div>
                    </div>
                    <h3 style="font-size: 16px; border-bottom: 1px solid #ccc; padding-bottom: 5px;">السجل التفصيلي للملاحظات والمخالفات:</h3>
                    <table style="width: 100%; border-collapse: collapse; text-align: right; margin-top: 10px; font-size: 13px;">
                        <thead>
                            <tr style="background: #e4e4e7;">
                                <th style="padding: 8px; border: 1px solid #ddd;">التاريخ والوقت</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">الإجراء</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">السبب / الملاحظة</th>
                                <th style="padding: 8px; border: 1px solid #ddd;">الرصيد</th>
                            </tr>
                        </thead>
                        <tbody>${logsHTML}</tbody>
                    </table>
                </div>
            `;
            const printArea = document.getElementById('print-area');
            printArea.innerHTML = printContent;
            printArea.classList.remove('hidden');
            window.print();
            printArea.classList.add('hidden');
            printArea.innerHTML = '';
        }

        function exportCSV() {
            const list = appData[currentSubject].students;
            if(list.length === 0) { alert('لا توجد بيانات لهذه المادة!'); return; }
            let csvContent = "\uFEFFاسم الطالب,الصف,الدرجة (/20),خضراء,صفراء,حمراء\n";
            list.forEach(s => { csvContent += `"${s.name}","${s.grade}",${s.score.toFixed(1)},${s.green},${s.yellow},${s.red}\n`; });
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.setAttribute('download', `Teacher_Behavior_${currentSubject.toUpperCase()}_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function resetAllScores() {
            if(confirm(`هل تريد تصفير النقاط والبطاقات لمادة (${currentSubject.toUpperCase()}) فقط؟`)) {
                saveSnapshot();
                appData[currentSubject].students.forEach(s => { s.score = 20.0; s.green = 0; s.yellow = 0; s.red = 0; });
                appData[currentSubject].logs = [];
                saveData();
                renderStudents();
            }
        }

        switchSubject('islamic');
    </script>
</body>
</html>
